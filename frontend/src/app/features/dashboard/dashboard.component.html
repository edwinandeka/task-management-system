<mat-toolbar color="primary">
  <span>Task Management System</span>
  <span class="dashboard-toolbar__spacer"></span>
  @if (currentUser(); as user) {
    <span class="dashboard-toolbar__user">{{ user.fullName }} · {{ user.role }}</span>
  }
  <button mat-icon-button aria-label="Logout" (click)="logout()">
    <mat-icon>logout</mat-icon>
  </button>
</mat-toolbar>

<main class="dashboard-content">
  <mat-card appearance="outlined">
    <mat-card-header>
      <mat-card-title>Welcome</mat-card-title>
      <mat-card-subtitle>You are signed in</mat-card-subtitle>
    </mat-card-header>
    <mat-card-content>
      <p>
        The task list, task form and task detail views will be wired here in the next iteration.
      </p>
      @if (currentUser(); as user) {
        <p>Signed in as <strong>{{ user.email }}</strong>.</p>
      }
    </mat-card-content>
  </mat-card>
</main>
