spring:
  datasource:
    url: jdbc:h2:mem:task_management_db;MODE=MySQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

security:
  jwt:
    secret: test-secret-must-be-at-least-32-bytes-long-aaaaaa
    issuer: task-management-api-test
    expiration-minutes: 60
