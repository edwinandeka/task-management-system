server:
  port: 8081

spring:
  application:
    name: task-management-api

  datasource:
    url: jdbc:mysql://localhost:3306/task_management_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  jackson:
    time-zone: UTC

security:
  jwt:
    secret: ${JWT_SECRET:dev-secret-change-me-please-min-32-bytes-long-aaaaaa}
    issuer: task-management-api
    expiration-minutes: 60